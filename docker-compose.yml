services:
  webhook:
    build: .
    image: ordered-webhook:latest
    container_name: ordered-webhook
    ports:
      - "8080:8080"
    environment:
      DATABASE_PATH: /data/webhook.db
      # --- delivery tuning (defaults shown; override as needed) ---
      MAX_ATTEMPTS: "5"
      BACKOFF_BASE: "1"
      BACKOFF_FACTOR: "2"
      BACKOFF_MAX: "300"
      DELIVERY_TIMEOUT: "10"
    volumes:
      - webhook-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  webhook-data:
